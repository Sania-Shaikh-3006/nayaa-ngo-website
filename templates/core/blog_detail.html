{% extends "base.html" %}{% block title %}{{post.title}}{% endblock %}{% block content %}<section class="page-hero"><div class="container"><div class="eyebrow">{{post.category}}</div><h1>{{post.title}}</h1><p>{{post.published_at}}</p></div></section><section class="section"><div class="container col-lg-8">{% if post.image %}<img class="img-fluid rounded-4 mb-4" src="{{post.image.url}}" alt="{{post.title}}">{% endif %}<div>{{post.body|linebreaks}}</div></div></section>{% endblock %}
