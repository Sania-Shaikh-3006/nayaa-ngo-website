<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Check Your Email | NAYAA</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #e8f5e9, #f7fff8);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 500px;
            background: #ffffff;
            padding: 45px 38px;
            border-radius: 18px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.10);
            text-align: center;
        }

        .logo {
            font-size: 32px;
            font-weight: 800;
            letter-spacing: 3px;
            color: #238b45;
            margin-bottom: 22px;
        }

        .icon {
            width: 70px;
            height: 70px;
            margin: 0 auto 22px;
            border-radius: 50%;
            background: #e8f5e9;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 34px;
        }

        h1 {
            margin: 0 0 15px;
            color: #222;
            font-size: 28px;
        }

        p {
            color: #666;
            font-size: 15px;
            line-height: 1.7;
            margin: 0 0 25px;
        }

        .button {
            display: inline-block;
            padding: 13px 25px;
            background: #238b45;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 700;
            transition: 0.2s;
        }

        .button:hover {
            background: #1b7138;
        }
    </style>
</head>

<body>

    <div class="card">

        <div class="logo">NAYAA</div>

        <div class="icon">
            ✉
        </div>

        <h1>Check Your Email</h1>

        <p>
            If an account exists with the email address you entered,
            we have sent instructions to reset your password.
            Please check your inbox and follow the link provided.
        </p>

        <a href="{% url 'login' %}" class="button">
            Back to Login
        </a>

    </div>

</body>
</html>
