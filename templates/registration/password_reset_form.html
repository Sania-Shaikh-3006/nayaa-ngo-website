<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password | NAYAA</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #e8f5e9, #f7fff8);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 460px;
            background: #ffffff;
            padding: 42px 38px;
            border-radius: 18px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.10);
            text-align: center;
        }

        .logo {
            font-size: 32px;
            font-weight: 800;
            letter-spacing: 3px;
            color: #238b45;
            margin-bottom: 20px;
        }

        h1 {
            margin: 0 0 12px;
            color: #222;
            font-size: 28px;
        }

        .description {
            color: #666;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        form {
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: 600;
            color: #333;
        }

        input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #d5d5d5;
            border-radius: 8px;
            font-size: 15px;
            margin-bottom: 15px;
            outline: none;
        }

        input:focus {
            border-color: #238b45;
            box-shadow: 0 0 0 2px rgba(35, 139, 69, 0.10);
        }

        .helptext {
            display: block;
            color: #777;
            font-size: 13px;
            margin-bottom: 15px;
        }

        .errorlist {
            list-style: none;
            padding: 0;
            margin: 0 0 12px;
            color: #c62828;
            font-size: 13px;
        }

        .button {
            width: 100%;
            border: none;
            padding: 14px;
            border-radius: 8px;
            background: #238b45;
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
        }

        .button:hover {
            background: #1b7138;
        }

        .back-link {
            display: inline-block;
            margin-top: 22px;
            color: #238b45;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
        }

        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="card">

        <div class="logo">NAYAA</div>

        <h1>Forgot Password?</h1>

        <p class="description">
            Enter your registered email address and we will send you
            instructions to reset your password.
        </p>

        <form method="post">
            {% csrf_token %}

            {{ form.non_field_errors }}

            <label for="{{ form.email.id_for_label }}">
                Email Address
            </label>

            {{ form.email }}

            {{ form.email.errors }}

            <button type="submit" class="button">
                Send Reset Link
            </button>
        </form>

        <a href="{% url 'login' %}" class="back-link">
            ← Back to Login
        </a>

    </div>

</body>
</html>
